<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chat ログモニター</title>
  <base target="_top">
  <?!= HtmlService.createHtmlOutputFromFile("css").getContent(); ?>
  <style>
    /* ログモニター固有のスタイル */
    
    .controls input {
      width: 200px;
    }
    
    .log-table-container {
      background: var(--bg-card);
      border-radius: var(--radius-xl);
      padding: 15px;
      overflow-x: auto;
    }
    
    td {
      word-break: break-word;
      max-width: 500px;
    }
    
    .log-level {
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      font-weight: bold;
      font-size: 12px;
      display: inline-block;
      width: 60px;
      text-align: center;
    }
    
    .log-level.trace {
      background: #4a4a4a;
      color: #aaa;
    }
    
    .log-level.info {
      background: #1a4a3a;
      color: var(--success-color);
    }
    
    .log-level.warn {
      background: #4a3a1a;
      color: var(--warning-color);
    }
    
    .log-level.error {
      background: #4a1a1a;
      color: var(--danger-color);
    }
    
    .timestamp {
      color: var(--text-muted);
      font-size: 12px;
      white-space: nowrap;
    }
    
    .message {
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.5;
    }
    
    .message.error-text {
      color: var(--danger-color);
    }
    
    .message.warn-text {
      color: var(--warning-color);
    }
    
    .auto-refresh-indicator {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--success-color);
      font-size: 12px;
    }
    
    .auto-refresh-indicator .dot {
      width: 8px;
      height: 8px;
      background: var(--success-color);
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    
    .log-count {
      color: var(--text-muted);
      font-size: 14px;
    }
    
    .filter-active {
      border-color: var(--primary-color) !important;
      box-shadow: 0 0 5px rgba(0, 212, 255, 0.3);
    }
  </style>
  <!-- ヘッダー -->
  <div class="header">
    <div class="header-left">
      <span class="header-title">📊 ログモニター</span>
    </div>
    <div>
      <button class="btn btn-edit" onclick="loadLogs()">🔄 更新</button>
    </div>
  </div>
  
    <!-- メインコンテンツ -->
    <div class="container">
    <a href="javascript:void(0)" onclick="goToAdmin()" target="_top" class="back-link" style="margin-bottom: 20px; display: inline-block;">← 管理者メニューに戻る</a>
    
    <h1 class="page-title">📊 AI Chat ログモニター</h1>
    <p class="page-description">アプリケーションのログを確認・管理します</p>
    
    <div class="controls">
      <select id="levelFilter">
        <option value="">全てのレベル</option>
        <option value="ERROR">ERROR</option>
        <option value="WARN">WARN</option>
        <option value="INFO">INFO</option>
        <option value="TRACE">TRACE</option>
      </select>
      
      <input type="text" id="searchInput" placeholder="ログ内容を検索...">
      
      <select id="limitSelect">
        <option value="50">50件</option>
        <option value="100" selected>100件</option>
        <option value="200">200件</option>
        <option value="500">500件</option>
      </select>
      
      <button onclick="loadLogs()">🔄 更新</button>
      <button class="refresh" onclick="toggleAutoRefresh()">
        <span id="autoRefreshBtnText">🔁 自動更新: オフ</span>
      </button>
      <button onclick="clearLogs()">🗑️ 表示クリア</button>
      <button onclick="exportLogs()">📥 エクスポート</button>
    </div>
    
    <div class="status info" id="status">
      <span id="statusText">読み込み中...</span>
      <div class="auto-refresh-indicator" id="autoRefreshIndicator" style="display: none;">
        <span class="dot"></span>
        自動更新中
      </div>
    </div>
    
    <div class="log-table-container">
      <table id="logTable">
        <thead>
          <tr>
            <th onclick="sortLogs('timestamp')">時刻 ↕</th>
            <th onclick="sortLogs('level')">レベル</th>
            <th onclick="sortLogs('message')">メッセージ</th>
          </tr>
        </thead>
        <tbody id="logBody">
          <tr>
            <td colspan="3" class="loading">ログを読み込み中...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- ローディングオーバーレイ -->
  <div id="loadingOverlay" class="loading-overlay hidden">
    <div class="loading-spinner"></div>
  </div>

  <script>
    // ローディング表示
    function showLoading(show) {
      var overlay = document.getElementById('loadingOverlay');
      if (show) {
        overlay.classList.remove('hidden');
      } else {
        overlay.classList.add('hidden');
      }
    }

    let logs = [];
    let filteredLogs = [];
    let sortColumn = 'timestamp';
    let sortDirection = 'desc';
    let autoRefreshInterval = null;
    let autoRefreshEnabled = false;
    let debugModeEnabled = false;
    let cachedAppUrl = null;
    
    // ページ読み込み時にログを取得
    window.onload = function() {
      showLoading(true);
      
      // URLを预先取得してキャッシュ
      google.script.run.withSuccessHandler(function(url) {
        cachedAppUrl = url;
      }).getAppUrl();
      
      // デバッグモード設定を取得
      google.script.run
        .withSuccessHandler(function(result) {
          debugModeEnabled = result === true;
          console.log('【デバッグ】デバッグモード:', debugModeEnabled);
          updateLevelFilterOptions();
          loadLogs();
        })
        .withFailureHandler(function(error) {
          console.log('【デバッグ】デバッグモード取得エラー:', error);
          loadLogs();
        })
        .isDebugModeEnabled();
    };
    
    // 初期データ読み込み完了後のローディング非表示
    function onDataLoaded() {
      showLoading(false);
    }
    
    // デバッグモードに基づいてレベルフィルタオプションを更新
    function updateLevelFilterOptions() {
      const levelFilter = document.getElementById('levelFilter');
      
      // 既存のTRACEオプションを削除
      const existingTrace = levelFilter.querySelector('option[value="TRACE"]');
      if (existingTrace) {
        existingTrace.remove();
      }
      
      // デバッグモードがONの場合のみTRACEオプションを追加
      if (debugModeEnabled) {
        const traceOption = document.createElement('option');
        traceOption.value = 'TRACE';
        traceOption.textContent = 'TRACE';
        levelFilter.appendChild(traceOption);
      }
      
      // 「Trace以外」オプションを追加（デバッグモードOFFの場合）
      const existingExceptTrace = levelFilter.querySelector('option[value="EXCEPT_TRACE"]');
      if (!existingExceptTrace) {
        const exceptTraceOption = document.createElement('option');
        exceptTraceOption.value = 'EXCEPT_TRACE';
        exceptTraceOption.textContent = 'Trace以外';
        levelFilter.insertBefore(exceptTraceOption, levelFilter.firstChild);
      }
    }
    
    // ログを取得
    function loadLogs() {
      const statusText = document.getElementById('statusText');
      const limit = document.getElementById('limitSelect').value;
      
      statusText.textContent = 'ログを読み込み中...';
      
      // Google Apps ScriptのWebアプリからログを取得
      google.script.run
        .withSuccessHandler(function(result) {
          let processedResult = result;
          
          // JSON文字列の場合はパース
          if (typeof result === 'string') {
            try {
              processedResult = JSON.parse(result);
            } catch (e) {
              processedResult = [];
            }
          }
          
          // 配列かどうかを確認
          if (!Array.isArray(processedResult)) {
            // オブジェクトの場合はvaluesプロパティを確認
            if (processedResult && typeof processedResult === 'object' && processedResult.values) {
              processedResult = processedResult.values;
            } else {
              processedResult = [];
            }
          }
          
          logs = processedResult || [];
          
          if (logs.length === 0) {
            statusText.textContent = 'ログがありません（データが空です）';
          }
          
          applyFilters();
          statusText.textContent = `最終更新: ${new Date().toLocaleString('ja-JP')} - ログ数: ${logs.length}件`;
          onDataLoaded();
        })
        .withFailureHandler(function(error) {
          showError('ログの取得に失敗しました: ' + error.message);
          onDataLoaded();
        })
        .getLogs(parseInt(limit));
    }
    
    // デバッグ用: ブラウザコンソールでログデータを直接確認
    window.getDebugLogs = function() {
      return { logs, filteredLogs, sortColumn, sortDirection };
    };
    
    // フィルタを適用
    function applyFilters() {
      const levelFilter = document.getElementById('levelFilter').value;
      const searchText = document.getElementById('searchInput').value.toLowerCase();
      
      filteredLogs = logs.filter(log => {
        // レベルでフィルタ（Trace以外の場合）
        if (levelFilter === 'EXCEPT_TRACE') {
          if (log.level === 'TRACE') {
            return false;
          }
        } else if (levelFilter && log.level !== levelFilter) {
          // 通常のレベルフィルタ
          return false;
        }
        
        // テキストでフィルタ
        if (searchText && !log.message.toLowerCase().includes(searchText)) {
          return false;
        }
        
        return true;
      });
      
      sortLogs(sortColumn, false);
      renderLogs();
    }
    
    // ログをソート
    function sortLogs(column, toggle = true) {
      if (toggle && sortColumn === column) {
        sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
      } else {
        sortColumn = column;
        sortDirection = column === 'timestamp' ? 'desc' : 'asc';
      }
      
      filteredLogs.sort((a, b) => {
        let valA = a[column];
        let valB = b[column];
        
        if (column === 'timestamp') {
          valA = new Date(valA);
          valB = new Date(valB);
        } else if (column === 'level') {
          const levelOrder = { 'ERROR': 4, 'WARN': 3, 'INFO': 2, 'TRACE': 1 };
          valA = levelOrder[valA] || 0;
          valB = levelOrder[valB] || 0;
        }
        
        if (valA < valB) return sortDirection === 'asc' ? -1 : 1;
        if (valA > valB) return sortDirection === 'asc' ? 1 : -1;
        return 0;
      });
      
      renderLogs();
    }
    
    // ログを表示
    function renderLogs() {
      const tbody = document.getElementById('logBody');
      
      if (filteredLogs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" class="empty-state">ログがありません</td></tr>';
        return;
      }
      
      let html = '';
      filteredLogs.forEach(log => {
        const levelClass = log.level.toLowerCase();
        const messageClass = levelClass === 'error' ? 'error-text' : levelClass === 'warn' ? 'warn-text' : '';
        
        html += `
          <tr>
            <td class="timestamp">${formatTimestamp(log.timestamp)}</td>
            <td><span class="log-level ${levelClass}">${log.level}</span></td>
            <td class="message ${messageClass}">${escapeHtml(log.message)}</td>
          </tr>
        `;
      });
      
      tbody.innerHTML = html;
    }
    
    // タイムスタンプをフォーマット
    function formatTimestamp(timestamp) {
      if (!timestamp) return '-';
      
      let date;
      // 文字列の場合、ISO形式をパース
      if (typeof timestamp === 'string') {
        // ISO形式の日付をパース
        date = new Date(timestamp.replace('Z', '+00:00'));
      } else {
        date = new Date(timestamp);
      }
      
      // Invalid Dateの場合、元の値をそのまま返す
      if (isNaN(date.getTime())) {
        return timestamp;
      }
      
      return date.toLocaleString('ja-JP', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
    }
    
    // HTMLエスケープ
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    // エラーを表示
    function showError(message) {
      const status = document.getElementById('status');
      const statusText = document.getElementById('statusText');
      status.className = 'status error';
      statusText.textContent = message;
    }
    
    // 自動更新を切り替え
    function toggleAutoRefresh() {
      autoRefreshEnabled = !autoRefreshEnabled;
      const btnText = document.getElementById('autoRefreshBtnText');
      const indicator = document.getElementById('autoRefreshIndicator');
      
      if (autoRefreshEnabled) {
        btnText.textContent = '🔁 自動更新: オン';
        indicator.style.display = 'flex';
        autoRefreshInterval = setInterval(loadLogs, 10000); // 10秒ごとに更新
      } else {
        btnText.textContent = '🔁 自動更新: オフ';
        indicator.style.display = 'none';
        clearInterval(autoRefreshInterval);
      }
    }
    
    // 表示をクリア
    function clearLogs() {
      filteredLogs = [];
      renderLogs();
      document.getElementById('statusText').textContent = '表示をクリアしました';
    }
    
    // ログをエクスポート
    function exportLogs() {
      if (filteredLogs.length === 0) {
        showError('エクスポートするログがありません');
        return;
      }
      
      let csv = 'タイムスタンプ,レベル,メッセージ\n';
      filteredLogs.forEach(log => {
        const message = log.message.replace(/"/g, '""').replace(/\n/g, '\r\n');
        csv += `"${log.timestamp}","${log.level}","${message}"\n`;
      });
      
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `line-bot-logs-${new Date().toISOString().slice(0, 10)}.csv`;
      link.click();
    }
    
    // フィルタ入力時のイベント
    document.getElementById('levelFilter').addEventListener('change', applyFilters);
    document.getElementById('searchInput').addEventListener('input', applyFilters);
    document.getElementById('limitSelect').addEventListener('change', loadLogs);
    
    // キーボードショートカット
    document.addEventListener('keydown', function(e) {
      // Ctrl+R で更新
      if (e.ctrlKey && e.key === 'r') {
        e.preventDefault();
        loadLogs();
      }
    });
    
    // 管理者メニューに戻る（キャッシュ優先）
    function goToAdmin() {
      // キャッシュされたURLを優先使用
      if (cachedAppUrl) {
        window.top.location.href = cachedAppUrl + '?page=admin';
        return;
      }
      
      // キャッシュがない場合は非同期で取得
      showLoading(true);
      
      google.script.run.withSuccessHandler(function(url) {
        showLoading(false);
        
        if (url) {
          cachedAppUrl = url;
          window.top.location.href = url + '?page=admin';
        } else {
          alert('URLを取得できませんでした');
        }
      }).withFailureHandler(function(error) {
        showLoading(false);
        alert('エラー: ' + error.message);
      }).getAppUrl();
    }
    
  </script>
</body>
